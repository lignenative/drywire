[package]
name = "drywire-wasm"
description = "The Drywire protocol for the web client, as a WebAssembly module (ADR 0040)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A cdylib is the .wasm file the browser loads; the rlib lets `cargo test`
# check the same code natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drywire-proto.workspace = true

[lints]
workspace = true
