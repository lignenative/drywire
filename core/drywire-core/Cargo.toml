[package]
name = "drywire-core"
description = "Drywire's client logic: Opus, voice gate, jitter buffer, sender, receiver, mixer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["bundled-opus"]
# Build libopus from source with CMake (ADR 0009). Turned off only to check
# the code for a target this machine cannot build C for, such as Windows
# from a Mac: `cargo check` links nothing, so it needs no library.
bundled-opus = ["opusic-sys/bundled"]

[dependencies]
drywire-proto.workspace = true
getrandom.workspace = true
opusic-sys.workspace = true
rtrb.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# The integration tests set up their rooms through the real control plane.
drywire-control.workspace = true
serde_json.workspace = true

[lints]
workspace = true
