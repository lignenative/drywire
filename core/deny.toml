# cargo-deny configuration: the license rules of CLAUDE.md, enforced on
# every crate the workspace pulls in, for every target we build.
# Run with `cargo deny check` from core/ (CI does).

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "aarch64-apple-ios",
]

[licenses]
# CLAUDE.md, "Dependencies and licenses". Unicode-3.0 is allowed for the
# Unicode tables of unicode-ident (ADR 0008). A crate offering a choice
# ("MIT OR Apache-2.0 OR LGPL-2.1-or-later") passes when one of its
# options is on this list.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are MIT and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version, by design.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# A crate with a known vulnerability fails the check; yanked crates too.
yanked = "deny"
ignore = [
    # Timing leaks in crypto-bigint 0.5's arithmetic, fixed only in 0.7.
    # OpenMLS's crypto provider brings it for the P-256 and P-384 suites
    # (p256, p384, elliptic-curve 0.13). Drywire's groups use X25519 and
    # Ed25519 only (drywire-mls refuses any other suite), so that code
    # never handles a secret: at most it checks a hostile key package's
    # public signature. Looked at again with each OpenMLS release.
    { id = "RUSTSEC-2026-0387", reason = "P-256/P-384 code never runs on secrets in drywire-mls" },
]
