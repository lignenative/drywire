# The Rust workspace shared by every Drywire client. See README.md.
[workspace]
resolver = "3"
members = [
    "drywire-proto",
    "drywire-core",
    "drywire-control",
    "drywire-mls",
    "drywire-bench",
    "drywire-cli",
    "drywire-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lignenative/drywire"
publish = false

# Every dependency is checked against the allowed licenses in CLAUDE.md
# before it is added here. Versions are pinned to a minor release.
[workspace.dependencies]
drywire-proto = { path = "drywire-proto" }
drywire-core = { path = "drywire-core", default-features = false }
drywire-control = { path = "drywire-control" }
drywire-mls = { path = "drywire-mls" }
# Without default features opusic-sys links a libopus found on the system;
# drywire-core's `bundled-opus` feature (on by default) builds it instead.
opusic-sys = { version = "0.7", default-features = false }
getrandom = "0.4"
# A wait-free single-producer, single-consumer ring: frames from the
# network thread to the playback callback (ADR 0017). No dependencies.
rtrb = "0.4"
# Unix only: `poll`, to wait on the call's non-blocking socket (ADR 0016),
# and `signal`, so the command-line client leaves a call cleanly on Ctrl-C.
libc = "0.2"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
ed25519-dalek = "3.0"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
# The control plane client's HTTPS (ADR 0022): ureq with rustls on ring,
# and the operating system's certificate store, not a bundled copy.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# MLS (RFC 9420) for the spaces' groups (ADR 0052): OpenMLS, MIT, with
# its pure-Rust crypto provider and in-memory storage.
openmls = "0.9.2"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Windows only: Microsoft's bindings, for the WASAPI backend (ADR 0013).
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Development builds keep debug information for this project's own code
# only: the dependencies' made most of a build's size on disk, and a
# backtrace through them still names their functions.
[profile.dev.package."*"]
debug = false
