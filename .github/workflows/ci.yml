# Continuous integration. Every job runs the same checks a contributor
# runs with `make test`, on the systems Drywire targets.
#
# Actions are pinned to a commit, not a tag, so that a moved tag can never
# change what runs here; the comment says which release that commit is.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The relay and the Rust core on Linux and macOS: gofmt, go vet,
  # go test -race, cargo fmt, clippy and test, as make test runs them.
  # The Rust tests start the real relay, so Go is installed everywhere.
  # The desktop app is checked here too: its interface typechecked and
  # tested with Bun, its Tauri crate linted and tested (desktop/README.md).
  test:
    name: make test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
          # Lets make test check that the Windows backend compiles.
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            core
            desktop/src-tauri
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/.bun-version
      # What Tauri needs on Linux: WebKitGTK for the window, and the
      # libraries behind the tray icon and the menus.
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: make test

  # The real Windows build: libopus with MSVC and CMake, the WASAPI
  # backend linked, and the tests run. Then the desktop app: its tests
  # (DPAPI for real), and its installer, built by the Tauri CLI. A hosted runner has no sound card,
  # so `drywire devices` only shows that WASAPI answers without
  # crashing; its output is informative, not checked. The release
  # binaries are kept as a workflow artifact, "drywire-windows", to
  # download from the run's page and try on a Windows PC.
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            core
            desktop/src-tauri
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/.bun-version
      - name: cargo test
        working-directory: core
        run: cargo test
      - name: cargo build --release -p drywire-cli
        working-directory: core
        run: cargo build --release -p drywire-cli
      - name: drywire devices
        working-directory: core
        continue-on-error: true
        run: .\target\release\drywire.exe devices
      - name: go build drywire-server
        working-directory: server
        run: go build -o drywire-server.exe ./cmd/drywire-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drywire-windows
          path: |
            core/target/release/drywire.exe
            server/drywire-server.exe
          if-no-files-found: error
      - name: desktop interface (typecheck, tests, licenses)
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun ../scripts/js-licenses.ts .
      - name: desktop cargo clippy and test
        working-directory: desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      # The installer, unsigned for now (spec section 16). The app inside
      # is drywire-desktop.exe; the installer and the Start menu say
      # Drywire.
      - name: desktop installer
        working-directory: desktop
        run: bun run tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drywire-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Licenses of every Go dependency of the server, against the list in
  # CLAUDE.md (scripts/go-licenses.sh).
  go-licenses:
    name: go-licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: scripts/go-licenses.sh

  # Licenses, banned and duplicate crates, sources and security advisories
  # of every Rust dependency (core/deny.toml).
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: core/Cargo.toml
          command: check
      # The desktop app's crates, Tauri's among them (desktop/src-tauri/deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: desktop/src-tauri/Cargo.toml
          command: check
